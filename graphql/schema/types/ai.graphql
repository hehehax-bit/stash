input AITranslateInput {
  "Entity types to translate: 'scene', 'image' and/or 'performer'. Default all three."
  entity_types: [String!]
  "Maximum items to translate. 0 for no limit."
  max_items: Int
  "Target language (e.g. en, de). Overrides the configured translation language."
