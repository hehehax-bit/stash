  summary: String!
  audio_codec: String!
  created_at: Time!
  updated_at: Time!
  scene: Scene
}

input AIPerformerCareerInput {
  performer_ids: [Int!]
  "Maximum performers to process. 0 for no limit."
  max_performers: Int
  "Whether to re-analyze performers that already have a career profile. Default false."
  overwrite: Boolean
  "Timeout in seconds for the AI request. Set to 0 (default) for the default 300s timeout."
  timeout: Int
}

type AIPerformerCareer {
  id: ID!
  performer_id: ID!
  career_start: Int
  career_end: Int
  active_years: [String!]!
  primary_niches: [String!]!
  notable_studios: [String!]!
  career_highlights: String!
