enum AISmartCollectionsOutputType {
  "Create groups containing scenes"
  GROUPS
  "Create galleries containing images"
  GALLERIES
  "Create both groups and galleries"
  GROUPS_AND_GALLERIES
}

input AISmartCollectionsInput {
  "Maximum scenes to use when computing library statistics. 0 for no limit."
  max_scenes: Int
  "Maximum images to use when computing library statistics. 0 for no limit."
  max_images: Int
  "Maximum number of collections to create. 0 for the default (10)."
  max_collections: Int
  "Whether to replace existing AI-generated collections with the same name. Default false."
  overwrite: Boolean
  "Timeout in seconds for the AI request. Set to 0 (default) for the default 300s timeout."
  timeout: Int
  "Type of collections to create. Default GROUPS_AND_GALLERIES."
  output_type: AISmartCollectionsOutputType
}

input AIFileRenameInput {
  "Specific scenes to process. If empty, all scenes are considered."
  scene_ids: [Int!]
  "Specific images to process. If empty, all images are considered."
  image_ids: [Int!]
  "Maximum total items to process. 0 for no limit."
  max_items: Int
  "Whether to regenerate suggestions for entities that already have a pending suggestion. Default false."
  overwrite: Boolean
  "Timeout in seconds for the AI request. Set to 0 (default) for the default 300s timeout."
  timeout: Int
}

type AIFileRename {
  id: ID!
  entity_type: String!
  entity_id: ID!
  "The current filename, including extension."
  current_name: String!
  "The suggested filename, without extension."
  suggested_name: String!
  "Status: pending, applied, or rejected."
  status: String!
  created_at: Time!
  updated_at: Time!
  scene: Scene
  image: Image
}

input AIFileRenameApplyInput {
  rename_id: ID!
}

input AIAuditInput {
  "Entity types to audit: 'scene' and/or 'image'. Default both."
  entity_types: [String!]
  "Maximum items to audit. 0 for no limit."
  max_items: Int
  "Timeout in seconds for the AI request. Set to 0 (default) for the default 300s timeout."
  timeout: Int
}

type AIAudit {
