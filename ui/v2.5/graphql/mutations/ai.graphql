mutation ConfigureAI($input: AIConfigInput!) {
  configureAI(input: $input) {
    enabled
    base_url
    model
    embedding_model
    system_prompt
    automatic1111_enabled
    automatic1111_base_url
    transcription_base_url
    transcription_model
    tag
  }
}

mutation AIChatSend($input: AIChatSendInput!) {
  aiChatSend(input: $input) {
    id
    session_id
    role
    content
    created_at
  }
}

